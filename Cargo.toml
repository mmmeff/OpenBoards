[package]
name = "openboards"
version = "0.1.0"
edition = "2021"
description = "Clean-room, self-hostable single-binary implementation of Vercel Boards"
repository = "https://github.com/mmmeff/OpenBoards"
readme = "README.md"
keywords = ["boards", "cli", "agents", "messaging", "tasks"]
categories = ["command-line-utilities", "web-programming::http-server"]

[[bin]]
name = "ob"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-core = "0.3"
http-body-util = "0.1"
jsonschema = { version = "0.29", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite", "postgres"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
